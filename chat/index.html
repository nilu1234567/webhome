<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Chat - Join a room with a 4-digit code and connect instantly.">
<title>Chat - Connect Instantly</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
<div class="join-page">
  <div class="join-logo">
    <div class="join-logo-icon">&#x1F4AC;</div>
    <h1>Chat</h1>
    <p>Connect Instantly</p>
  </div>

  <div class="join-card glass-card">
    <h2>Join a Room</h2>

    <div class="form-group">
      <label class="form-label">4-Digit Room Code</label>
      <div class="input-wrapper">
        <span class="input-icon">&#x1F511;</span>
        <input id="codeInput" class="input-field code-single" type="text"
               inputmode="numeric" maxlength="4"
               placeholder="Enter 4-digit code" autocomplete="off">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Your Display Name</label>
      <div class="input-wrapper">
        <span class="input-icon">&#x1F464;</span>
        <input id="nameInput" class="input-field" type="text"
               placeholder="Enter your name" maxlength="30" autocomplete="off">
      </div>
    </div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn-primary" id="joinBtn" onclick="handleJoin()">
      Join Room &rarr;
    </button>

    <div class="security-badge">
      &#x1F512; 256-bit secure room connection
    </div>
  </div>

  <div class="join-footer">
    Create a room? <a href="/admin">Contact admin</a>
  </div>
</div>

<script>
var codeInput = document.getElementById('codeInput');

codeInput.addEventListener('input', function(e) {
  e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 4);
});

codeInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleJoin();
});

document.getElementById('nameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleJoin();
});

async function handleJoin() {
  var code = codeInput.value.trim();
  var name = document.getElementById('nameInput').value.trim();
  var errEl = document.getElementById('errorMsg');
  var btn = document.getElementById('joinBtn');

  errEl.classList.remove('show');

  if (code.length !== 4) { showError('Please enter the complete 4-digit code'); return; }
  if (!name) { showError('Please enter your display name'); return; }

  btn.textContent = 'Joining...';
  btn.disabled = true;

  try {
    var res = await fetch('/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, name: name })
    });
    var data = await res.json();
    if (res.ok) {
      sessionStorage.setItem('chatUser', JSON.stringify({ name: name, roomId: data.roomId, roomName: data.roomName }));
      window.location.href = '/chat/' + data.roomId;
    } else {
      showError(data.error || 'Something went wrong');
      btn.textContent = 'Join Room';
      btn.disabled = false;
    }
  } catch (err) {
    showError('Network error. Please try again.');
    btn.textContent = 'Join Room';
    btn.disabled = false;
  }
}

function showError(msg) {
  var el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}
</script>
</body>
</html>
