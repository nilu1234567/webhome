<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="RAKESH Chat Service - Enterprise Admin Console">
<title>Admin Portal - RAKESH Chat Service</title>
<link rel="stylesheet" href="/chat/css/style.css">
</head>
<body>
<div class="admin-page">
  <div class="admin-login-card">
    <div class="admin-logo">
      <div class="icon">&#x1F6E1;&#xFE0F;</div>
      <h1 style="font-size:1.55rem; font-weight:800;">RAKESH Chat Service</h1>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-top:0.25rem;">
        Enterprise Admin Console &bull; <a href="https://rakesh.qd.je" target="_blank" style="color:var(--primary-bright); text-decoration:none; font-weight:600;">rakesh.qd.je &nearr;</a>
      </p>
    </div>

    <div class="glass-card">
      <div class="form-group">
        <label class="form-label">Admin Security Password</label>
        <div class="input-wrapper">
          <span class="input-icon">&#x1F511;</span>
          <input id="passInput" class="input-field" type="password" placeholder="Enter admin password" autocomplete="current-password">
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button class="btn-primary" onclick="handleLogin()" style="margin-top:0.5rem;">
        Authenticate &rarr;
      </button>
    </div>

    <div class="join-footer" style="margin-top:1.5rem; display:flex; flex-direction:column; gap:0.5rem; align-items:center;">
      <a href="/chat">&larr; Back to Join Room</a>
      <span style="font-size:0.75rem; color:var(--text-muted);">
        A product of <a href="https://rakesh.qd.je" target="_blank" style="color:var(--primary-bright); text-decoration:none; font-weight:600;">RAKESH.QD.JE</a> IT Solutions
      </span>
    </div>
  </div>
</div>

<script>
async function handleLogin() {
  const pass = document.getElementById('passInput').value;
  const errEl = document.getElementById('errorMsg');
  errEl.classList.remove('show');

  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const data = await res.json();
    if (res.ok) window.location.href = '/admin/dashboard';
    else {
      errEl.textContent = data.error || 'Authentication failed';
      errEl.classList.add('show');
    }
  } catch {
    errEl.textContent = 'Network error. Please try again.';
    errEl.classList.add('show');
  }
}

document.getElementById('passInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleLogin();
});
</script>
</body>
</html>
