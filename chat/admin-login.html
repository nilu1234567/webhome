<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="description" content="Admin login â€“ Chat app management">
<title>Admin Login â€“ Chat</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="admin-page">
  <div class="admin-login-card">
    <div class="admin-logo">
      <div class="icon">ðŸ›¡ï¸</div>
      <h1>Admin Panel</h1>
      <p>Manage your chat rooms</p>
    </div>

    <div class="glass-card">
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">ðŸ”</span>
          <input id="passInput" class="input-field" type="password" placeholder="Enter admin password" autocomplete="current-password">
        </div>
      </div>

      <div class="error-msg" id="errorMsg"></div>

      <button class="btn-primary" onclick="handleLogin()">Sign In â†’</button>
    </div>

    <div class="join-footer" style="margin-top:1rem;">
      <a href="/">â† Back to join screen</a>
    </div>
  </div>
</div>

<script>
async function handleLogin() {
  const pass = document.getElementById('passInput').value;
  const errEl = document.getElementById('errorMsg');
  errEl.classList.remove('show');

  try {
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass })
    });
    const data = await res.json();
    if (res.ok) window.location.href = '/admin/dashboard';
    else {
      errEl.textContent = data.error || 'Login failed';
      errEl.classList.add('show');
    }
  } catch {
    errEl.textContent = 'Network error';
    errEl.classList.add('show');
  }
}

document.getElementById('passInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleLogin();
});
</script>
</body>
</html>
