<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रजिस्ट्री शुल्क कैलकुलेटर - Registry Master</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #e2e8f0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        /* Custom scrollbar for better aesthetics on black theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e1e1e;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #2e2e2e;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Inline SVG Icon Component to prevent DOM mismatch errors
        const Icon = ({ name, className }) => {
            const icons = {
                'landmark': (
                    <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <path d="m3 21 2-2h14l2 2"/><path d="M5 19l2-10 5-5 5 5 2 10"/><path d="M9 19v-4"/><path d="M15 19v-4"/><path d="M12 19v-4"/>
                    </g>
                ),
                'chevron-down': (
                    <path fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" d="m6 9 6 6 6-6" />
                ),
                'info': (
                    <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
                    </g>
                ),
                'table': (
                    <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M3 15h18"/><path d="M9 3v18"/><path d="M15 3v18"/>
                    </g>
                ),
                'check-circle-2': (
                    <g fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                        <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
                    </g>
                )
            };

            return (
                <svg 
                    width="24" 
                    height="24" 
                    viewBox="0 0 24 24" 
                    className={className}
                    aria-hidden="true"
                >
                    {icons[name]}
                </svg>
            );
        };

        const App = () => {
            const [rateType, setRateType] = useState('new'); 
            const [propertyValue, setPropertyValue] = useState(""); 
            const [personCount, setPersonCount] = useState(2); 
            const [selectedDoc, setSelectedDoc] = useState('sale_deed');
            const [variant, setVariant] = useState('male');

            const documentRates = {
                sale_deed: {
                    name: "बिक्रीनामा (Sale Deed)",
                    variants: [
                        { id: 'male', label: 'पुरुष (Male)', old: 6.25, new: 6.6, regType: 'percent', regValue: 4 },
                        { id: 'female', label: 'महिला (Female)', old: 5.2, new: 5.48, regType: 'percent', regValue: 4 }
                    ]
                },
                gift_deed: {
                    name: "दान पत्र (Gift Deed)",
                    variants: [
                        { id: 'family', label: 'पारिवारिक (Family)', old: 1.525, new: 1.560, regType: 'fixed', regValue: 500 },
                        { id: 'non_family', label: 'गैर-पारिवारिक', old: 6.25, new: 6.6, regType: 'percent', regValue: 4 }
                    ]
                },
                relinquishment: {
                    name: "हकत्याग (Relinquishment)",
                    variants: [
                        { id: 'family', label: 'पारिवारिक (Family)', old: 0.5, new: 0.5, regType: 'fixed', regValue: 1000 },
                        { id: 'non_family', label: 'गैर-पारिवारिक', old: 2.0, new: 2.0, regType: 'fixed', regValue: 1000 }
                    ]
                },
                mortgage: {
                    name: "बंधक विलेख (Mortgage)",
                    variants: [
                        { id: 'with_possession', label: 'कब्जा सहित', old: 5.0, new: 5.0, regType: 'percent', regValue: 0.8 },
                        { id: 'without_possession', label: 'कब्जा रहित', old: 2.0, new: 2.0, regType: 'percent', regValue: 0.8 }
                    ]
                },
                agreement: {
                    name: "इकरारनामा (Agreement)",
                    variants: [
                        { id: 'with_possession', label: 'कब्जा सहित', old: 5.0, new: 5.0, regType: 'percent', regValue: 0.8 },
                        { id: 'without_possession', label: 'कब्जा रहित', old: 100, new: 100, regType: 'percent', regValue: 0.8, isFixedStamp: true }
                    ]
                },
                partition: {
                    name: "बंटवारा (Partition)",
                    variants: [
                        { id: 'non_agri', label: 'गैर-कृषि', old: 200, new: 200, regType: 'percent', regValue: 0.8, isPerPerson: true },
                        { id: 'agri', label: 'कृषि भूमि', old: 100, new: 100, regType: 'percent', regValue: 0.8, isPerPerson: true }
                    ]
                },
                exchange: {
                    name: "तबादला नामा (Exchange)",
                    variants: [
                        { id: 'common', label: '5 एकड़ तक', old: 5.0, new: 5.0, regType: 'percent', regValue: 4 }
                    ]
                },
                loan: {
                    name: "लोन (Loan)",
                    variants: [
                        { id: 'rural', label: 'ग्रामीण (Rural)', old: 3.0, new: 3.0, regType: 'percent', regValue: 0.8 },
                        { id: 'urban', label: 'शहरी (Urban)', old: 2.0, new: 2.0, regType: 'percent', regValue: 0.8 }
                    ]
                }
            };

            const currentDoc = documentRates[selectedDoc];
            const currentVariant = currentDoc.variants.find(v => v.id === variant) || currentDoc.variants[0];

            useEffect(() => {
                setVariant(documentRates[selectedDoc].variants[0].id);
            }, [selectedDoc]);

            const calculation = useMemo(() => {
                const val = Number(propertyValue) || 0;
                const rate = rateType === 'new' ? currentVariant.new : currentVariant.old;
                
                let stampDuty = 0;
                if (currentVariant.isPerPerson) {
                    stampDuty = rate * personCount;
                } else if (currentVariant.isFixedStamp) {
                    stampDuty = rate;
                } else {
                    stampDuty = (val * rate) / 100;
                }
                
                let regFee = 0;
                if (currentVariant.regType === 'percent') {
                    regFee = (val * currentVariant.regValue) / 100;
                } else {
                    regFee = currentVariant.regValue;
                }

                return { 
                    stampRate: rate, 
                    stampDuty, 
                    regFee, 
                    total: stampDuty + regFee, 
                    regVal: currentVariant.regValue, 
                    regType: currentVariant.regType 
                };
            }, [propertyValue, rateType, currentVariant, personCount]);

            return (
                <div className="min-h-screen bg-black text-slate-200 p-4 md:p-8">
                    {/* Header */}
                    <div className="max-w-6xl mx-auto mb-10 flex items-center justify-between border-b border-zinc-900 pb-6">
                        <div className="flex items-center gap-4">
                            <div className="p-3 bg-blue-700 rounded-2xl shadow-lg shadow-blue-900/40">
                                <Icon name="landmark" className="w-8 h-8 text-white" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-black text-white uppercase tracking-tighter italic">Registry Master</h1>
                                <p className="text-[10px] text-zinc-500 font-bold uppercase tracking-widest italic">स्टाम्प एवं पंजीयन शुल्क गणना</p>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-6xl mx-auto grid lg:grid-cols-12 gap-8 items-start">
                        {/* Input Area */}
                        <div className="lg:col-span-7 space-y-6">
                            <div className="bg-[#050505] border border-zinc-900 rounded-[2.5rem] p-6 md:p-10 shadow-2xl">
                                {/* Rate Type Switcher */}
                                <div className="flex gap-2 mb-10 p-1.5 bg-black rounded-2xl border border-zinc-900">
                                    <button onClick={() => setRateType('new')} className={`flex-1 py-4 rounded-xl font-bold transition-all text-xs ${rateType === 'new' ? 'bg-blue-600 text-white shadow-xl shadow-blue-900/40' : 'text-zinc-500 hover:bg-zinc-900'}`}>नया रेट (2023)</button>
                                    <button onClick={() => setRateType('old')} className={`flex-1 py-4 rounded-xl font-bold transition-all text-xs ${rateType === 'old' ? 'bg-zinc-800 text-white' : 'text-zinc-500 hover:bg-zinc-900'}`}>पुराना रेट (2022)</button>
                                </div>

                                <div className="space-y-8">
                                    <div>
                                        <label className="block text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-4 px-1 italic">विलेख का प्रकार (Select Document)</label>
                                        <div className="relative">
                                            <select value={selectedDoc} onChange={(e) => setSelectedDoc(e.target.value)} className="w-full bg-black border-2 border-zinc-900 text-white p-5 rounded-3xl outline-none focus:border-blue-700 appearance-none font-bold text-lg">
                                                {Object.keys(documentRates).map(key => <option key={key} value={key}>{documentRates[key].name}</option>)}
                                            </select>
                                            <div className="absolute right-6 top-1/2 -translate-y-1/2 text-zinc-700 pointer-events-none">
                                                <Icon name="chevron-down" className="w-6 h-6" />
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-4 px-1 italic">श्रेणी (Category)</label>
                                        <div className="grid grid-cols-2 gap-4">
                                            {currentDoc.variants.map(v => (
                                                <button key={v.id} onClick={() => setVariant(v.id)} className={`py-5 px-4 rounded-3xl border-2 font-black transition-all text-sm tracking-tight ${variant === v.id ? 'border-blue-600 bg-blue-600/10 text-blue-400' : 'border-zinc-900 bg-black text-zinc-600 hover:border-zinc-800'}`}>
                                                    {v.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-8">
                                        <div>
                                            <label className="block text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-4 px-1 italic">संपत्ति मूल्य (Market Value - ₹)</label>
                                            <div className="relative">
                                                <span className="absolute left-5 top-1/2 -translate-y-1/2 text-blue-700 font-black text-2xl">₹</span>
                                                <input type="number" value={propertyValue} placeholder="यहाँ मूल्य दर्ज करें..." onChange={(e) => setPropertyValue(e.target.value)} className="w-full pl-12 pr-6 py-5 bg-black border-2 border-zinc-900 rounded-3xl outline-none focus:border-blue-700 text-3xl font-mono font-bold transition-all placeholder:text-zinc-900" />
                                            </div>
                                        </div>
                                        {currentVariant.isPerPerson && (
                                            <div className="animate-in fade-in">
                                                <label className="block text-[10px] font-black text-zinc-600 uppercase tracking-widest mb-4 px-1 italic">पक्षकारों की संख्या</label>
                                                <input type="number" value={personCount} onChange={(e) => setPersonCount(Math.max(1, Number(e.target.value)))} className="w-full px-8 py-5 bg-black border-2 border-zinc-900 rounded-3xl outline-none focus:border-blue-700 text-3xl font-mono font-bold" />
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Result Panel */}
                        <div className="lg:col-span-5 space-y-6">
                            <div className="bg-gradient-to-br from-[#080808] to-black rounded-[3rem] p-10 shadow-2xl relative overflow-hidden border border-zinc-900">
                                <div className="relative z-10 space-y-10">
                                    <div className="border-b border-zinc-900 pb-6">
                                        <h2 className="text-zinc-600 text-[10px] font-black uppercase tracking-widest mb-2 italic">कुल अनुमानित शुल्क</h2>
                                        <div className="text-5xl md:text-6xl font-black text-white font-mono tracking-tighter drop-shadow-xl">
                                            ₹{calculation.total.toLocaleString('en-IN')}
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <div className="flex justify-between items-center">
                                            <div className="text-zinc-500 text-sm font-bold flex flex-col uppercase tracking-tighter">
                                                <span>मुद्रांक शुल्क (Stamp)</span>
                                                <span className="text-xs text-blue-500 font-mono">{currentVariant.isPerPerson ? `₹${calculation.stampRate}/v` : (currentVariant.isFixedStamp ? 'नियत' : `${calculation.stampRate}%`)}</span>
                                            </div>
                                            <div className="text-2xl font-mono font-black text-white italic">₹{calculation.stampDuty.toLocaleString('en-IN')}</div>
                                        </div>

                                        <div className="flex justify-between items-center bg-[#050505] p-5 rounded-3xl border border-zinc-900 shadow-lg">
                                            <div className="text-zinc-400 text-sm font-black flex flex-col uppercase tracking-tighter">
                                                <span>पंजीयन शुल्क (Reg)</span>
                                                <span className="text-xs text-yellow-500 font-mono">{calculation.regType === 'percent' ? `${calculation.regVal}%` : `₹${calculation.regVal}`}</span>
                                            </div>
                                            <div className="text-3xl font-mono font-black text-yellow-500 drop-shadow-md italic">₹{calculation.regFee.toLocaleString('en-IN')}</div>
                                        </div>
                                    </div>

                                    <div className="bg-black/80 p-5 rounded-3xl flex items-start gap-4 border border-zinc-900">
                                        <Icon name="info" className="w-5 h-5 text-blue-700 mt-1 flex-shrink-0 opacity-50" />
                                        <p className="text-[11px] text-zinc-600 leading-relaxed font-semibold italic">गणना मे त्रुटि हो सकती  है। अंतिम सत्यापन के लिए पंजीयन विभाग के उप पंजीयक से परामर्श लें।</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Chart Area */}
                        <div className="lg:col-span-12 mt-12">
                            <div className="bg-[#020202] border border-zinc-900 rounded-[2.5rem] p-8 shadow-2xl overflow-hidden">
                                <h3 className="text-lg font-black text-white uppercase tracking-widest mb-8 flex items-center gap-3">
                                    <Icon name="table" className="w-6 h-6 text-blue-700" /> मास्टर रेट चार्ट (Highlights)
                                </h3>
                                
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-separate border-spacing-y-3">
                                        <thead>
                                            <tr className="text-[10px] font-black text-zinc-700 uppercase tracking-[0.2em]">
                                                <th className="px-6 py-4">विलेख का प्रकार (Document)</th>
                                                <th className="px-6 py-4">श्रेणी (Category)</th>
                                                <th className="px-6 py-4 text-center">स्टाम्प ({rateType === 'new' ? '2023' : '2022'})</th>
                                                <th className="px-6 py-4 text-center">पंजीयन (Reg)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {Object.keys(documentRates).map((docKey) => {
                                                const doc = documentRates[docKey];
                                                return doc.variants.map((v) => {
                                                    const isHighlighted = selectedDoc === docKey && variant === v.id;
                                                    const rate = rateType === 'new' ? v.new : v.old;
                                                    return (
                                                        <tr key={`${docKey}-${v.id}`} className={`transition-all duration-500 rounded-2xl ${isHighlighted ? 'bg-blue-600 shadow-[0_0_30px_rgba(37,99,235,0.4)]' : 'bg-black border border-zinc-950 hover:bg-zinc-900/20'}`}>
                                                            <td className="px-6 py-5 rounded-l-2xl">
                                                                <div className="flex items-center gap-3">
                                                                    {isHighlighted && <Icon name="check-circle-2" className="w-4 h-4 text-white" />}
                                                                    <span className={`text-sm font-bold ${isHighlighted ? 'text-white' : 'text-zinc-400'}`}>{doc.name}</span>
                                                                </div>
                                                            </td>
                                                            <td className="px-6 py-5">
                                                                <span className={`text-xs font-bold ${isHighlighted ? 'text-blue-100' : 'text-zinc-600'}`}>{v.label}</span>
                                                            </td>
                                                            <td className="px-6 py-5 text-center">
                                                                <span className={`text-sm font-mono font-black ${isHighlighted ? 'text-white' : 'text-zinc-500'}`}>{v.isPerPerson ? `₹${rate}/v` : (v.isFixedStamp ? `₹${rate}` : `${rate}%`)}</span>
                                                            </td>
                                                            <td className="px-6 py-5 text-center rounded-r-2xl">
                                                                <span className={`text-sm font-mono font-black ${isHighlighted ? 'text-yellow-200' : 'text-zinc-500'}`}>{v.regType === 'percent' ? `${v.regValue}%` : `₹${v.regValue}`}</span>
                                                            </td>
                                                        </tr>
                                                    );
                                                });
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <footer className="max-w-6xl mx-auto mt-20 text-center text-zinc-800 text-[10px] pb-12 border-t border-zinc-900 pt-10 uppercase tracking-[0.3em] font-bold">
                        Registry Master Calc Pro | © 2026 RAKESH TIWARI
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
